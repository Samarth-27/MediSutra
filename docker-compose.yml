version: '3.8'

# ==============================================================================
# MEDISUTRA PRODUCTION DOCKER COMPOSE ORCHESTRATION
# Architecture: App + PgBouncer (Transaction Mode) + PostgreSQL 17 + Redis 7
# ==============================================================================

services:
  # 1. MediSutra Unified Web & API Service
  medisutra-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medisutra_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgres://medisutra:medisutraSecure2026@pgbouncer:6432/medisutra_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=medisutra_production_jwt_secret_key_2026_secured_abdm
      - AI_SERVICE_URL=http://localhost:8000
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  # 2. PgBouncer Connection Pooler (Transaction Mode)
  # Multiplexes up to 5,000 incoming concurrent connections down to 20 PG workers
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: medisutra_pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      - DB_USER=medisutra
      - DB_PASSWORD=medisutraSecure2026
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=medisutra_db
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=5000
      - DEFAULT_POOL_SIZE=20
      - RESERVE_POOL_SIZE=5
      - SERVER_IDLE_TIMEOUT=60
    depends_on:
      postgres:
        condition: service_healthy

  # 3. PostgreSQL 17 Relational Database (Covering Indexes & Quarterly Partitioning)
  postgres:
    image: postgres:17-alpine
    container_name: medisutra_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=medisutra
      - POSTGRES_PASSWORD=medisutraSecure2026
      - POSTGRES_DB=medisutra_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medisutra -d medisutra_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Redis 7 High-Throughput Cache & BullMQ Background Worker Broker
  redis:
    image: redis:7-alpine
    container_name: medisutra_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
